<div class="backdrop" (click)="handleCancel()">
  <section class="modal" (click)="$event.stopPropagation()">
    <ng-content></ng-content>
    <div class="btn-container">
      <button (click)="handleCancel()" type="button" class="btn-cancelar">
        Cancelar
      </button>
      <button (click)="handleConfirm()" type="button" class="btn-executar">
        Salvar
      </button>
    </div>
  </section>
</div>
